name: Build Dobby Lua Dump

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME > /dev/null 2>&1
          echo "NDK installed"

      - name: Clone Dobby (official + patch asm for NDK)
        run: |
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git
          echo "=== Dobby dirs ==="
          ls Dobby/
          ls Dobby/external/ 2>/dev/null
          echo "=== Patching @PAGE/@PAGEOFF in asm files ==="
          grep -rl "@PAGE\|@PAGEOFF" Dobby/ 2>/dev/null || true
          find Dobby -name "*.asm" -exec sed -i 's/@PAGE/:pg_hi21:/g; s/@PAGEOFF/:lo12:/g' {} +
          echo "=== After patch ==="
          grep -n "pg_hi21\|lo12" Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm | head

      - name: Build Dobby static lib
        run: |
          cmake -B dobby-build \
            -S Dobby \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            > dobby_config.log 2>&1 || true
          echo "=== dobby config tail ==="
          tail -30 dobby_config.log
          cmake --build dobby-build --config Release > dobby_build.log 2>&1 || true
          echo "=== dobby build tail ==="
          tail -40 dobby_build.log
          echo "=== dobby artifacts ==="
          find dobby-build -name "*.a" -o -name "*.so" 2>/dev/null | head

      - name: Prepare Dobby lib
        run: |
          mkdir -p Dobby/lib
          find dobby-build -name "libdobby.a" -exec cp {} Dobby/lib/ \;
          ls -la Dobby/lib/

      - name: Configure our lib
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            > our_config.log 2>&1 || true
          echo "=== our config tail ==="
          tail -30 our_config.log

      - name: Build our lib
        run: |
          cmake --build build --config Release > our_build.log 2>&1 || true
          echo "=== our build tail ==="
          tail -40 our_build.log
          echo "=== outputs ==="
          find build -name "libdump*" 2>/dev/null | head

      - name: Package (always)
        if: always()
        run: |
          mkdir -p output/lib/arm64-v8a output/log
          SO=$(find build -name "libdump.so" 2>/dev/null | head -1)
          if [ -n "$SO" ]; then
            cp "$SO" output/lib/arm64-v8a/
            echo "Copied: $SO"
          else
            echo "NO libdump.so produced" > output/log/error.txt
          fi
          for f in dobby_config.log dobby_build.log our_config.log our_build.log; do
            [ -f "$f" ] && cp "$f" output/log/ || true
          done
          # Emit key log tails as annotations for API inspection
          echo "::error title=DOBBY_CONFIG::$(tail -5 dobby_config.log 2>/dev/null | tr '\n' ' ' | cut -c1-500)"
          echo "::error title=DOBBY_BUILD::$(tail -8 dobby_build.log 2>/dev/null | tr '\n' ' ' | cut -c1-500)"
          echo "::error title=OUR_CONFIG::$(tail -5 our_config.log 2>/dev/null | tr '\n' ' ' | cut -c1-500)"
          echo "::error title=OUR_BUILD::$(tail -8 our_build.log 2>/dev/null | tr '\n' ' ' | cut -c1-500)"
          echo "::error title=OUTPUTS::$(find build -name 'libdump*' 2>/dev/null | tr '\n' ' ')"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libdump-arm64
          path: output/