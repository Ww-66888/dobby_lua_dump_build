name: Build Dobby Lua Dump

permissions:
  contents: write
  issues: write

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME > /dev/null 2>&1
          echo "NDK at $ANDROID_HOME/ndk/27.0.12077973"

      - name: Clone Dobby (official) + patch for NDK
        run: |
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git
          python3 scripts/patch_dobby.py
          echo "=== verify patched asm ==="
          grep -n "ldr TMP_REG_0, =common_closure_bridge_handler" Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm || echo "PATCH-NOT-APPLIED"

      - name: Build Dobby static lib
        run: |
          cmake -B dobby-build -S Dobby \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS="-fPIC" \
            -DCMAKE_CXX_FLAGS="-fPIC" \
            > dobby_config.log 2>&1 || true
          echo "=== dobby config tail ==="
          tail -30 dobby_config.log
          cmake --build dobby-build --config Release --target dobby_static > dobby_build.log 2>&1 || true
          echo "=== dobby build: ERROR LINES (if any) ==="
          grep -niE "error:|error [0-9]+|fatal error|undefined reference|ld: " dobby_build.log | head -60 || echo "NO ERROR LINES FOUND"
          echo "=== dobby build tail (last 40 lines, full) ==="
          tail -40 dobby_build.log
          echo "=== dobby static artifacts ==="
          find dobby-build -name "libdobby*.a" -o -name "libdobby*.so" | head
          find dobby-build -name "libdobby*.a" -exec ls -la {} \;

      - name: Prepare Dobby lib
        run: |
          mkdir -p Dobby/lib
          A=$(find dobby-build -name "libdobby.a" | head -1)
          [ -z "$A" ] && A=$(find dobby-build -name "libdobby_static.a" | head -1)
          if [ -n "$A" ]; then cp "$A" Dobby/lib/libdobby.a && echo "copied $A"; else echo "NO dobby static lib produced"; fi
          ls -la Dobby/lib/ || true

      - name: Configure our lib
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            > our_config.log 2>&1 || true
          echo "=== our config tail ==="
          tail -30 our_config.log

      - name: Build our lib
        run: |
          cmake --build build --config Release > our_build.log 2>&1 || true
          echo "=== our build: ERROR LINES (if any) ==="
          grep -niE "error:|error [0-9]+|fatal error|undefined reference|ld: " our_build.log | head -60 || echo "NO ERROR LINES FOUND"
          echo "=== our build tail (last 40 lines, full) ==="
          tail -40 our_build.log
          echo "=== outputs ==="
          find build -name "libdump*.so" | head

      - name: Package (always)
        if: always()
        run: |
          mkdir -p output/lib/arm64-v8a output/log
          SO=$(find build -name "libdump.so" | head -1)
          if [ -n "$SO" ]; then
            cp "$SO" output/lib/arm64-v8a/
            echo "Copied: $SO"
          else
            echo "NO libdump.so produced" > output/log/error.txt
          fi
          for f in dobby_config.log dobby_build.log our_config.log our_build.log; do
            [ -f "$f" ] && cp "$f" output/log/ || true
          done
          echo "::error title=DOBBY_ERRORS::$(grep -niE 'error:|undefined reference|ld: ' dobby_build.log 2>/dev/null | tail -30 | tr '\n' ' ')"
          echo "::error title=OUR_ERRORS::$(grep -niE 'error:|undefined reference|ld: ' our_build.log 2>/dev/null | tail -30 | tr '\n' ' ')"
          echo "::error title=OUTPUTS::$(find build -name 'libdump*' 2>/dev/null | tr '\n' ' ')"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libdump-arm64
          path: output/

      - name: Publish diagnostics to issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          def r(p):
              try: return open(p).read()
              except: return "(missing)"
          def g(p, pat):
              try:
                  lines=[l for l in open(p).read().splitlines() if any(k in l for k in pat)]
                  return "\n".join(lines[-60:])
              except: return "(missing)"
          try:
              find = subprocess.run("find dobby-build -name 'libdobby*.a' -o -name 'libdobby*.so' 2>/dev/null", shell=True, capture_output=True, text=True).stdout.strip()
          except Exception:
              find = ""
          out=[]
          out.append("# CI diag run %s sha %s" % (os.environ.get('GITHUB_RUN_NUMBER','?'), os.environ.get('GITHUB_SHA','?')[:8]))
          out.append("")
          out.append("## dobby static lib present?"); out.append("```"); out.append(find or "(none)"); out.append("```")
          out.append("")
          out.append("## output/log/error.txt"); out.append("```"); out.append(r("output/log/error.txt")); out.append("```")
          out.append("")
          out.append("## our build log"); out.append("```"); out.append(r("our_build.log")); out.append("```")
          out.append("")
          out.append("## dobby build error lines"); out.append("```"); out.append(g("dobby_build.log",["error:","undefined reference","ld: ","fatal error"])); out.append("```")
          out.append("")
          out.append("## our config log (tail)"); out.append("```"); out.append("\n".join(r("our_config.log").splitlines()[-25:])); out.append("```")
          out.append("")
          out.append("## dobby config log (tail)"); out.append("```"); out.append("\n".join(r("dobby_config.log").splitlines()[-25:])); out.append("```")
          open("/tmp/DIAG.md","w").write("\n".join(out))
          print("DIAG written, bytes:", len("\n".join(out)))
          PY
          cp /tmp/DIAG.md DIAG.md
          git add DIAG.md
          git -c user.email=ci@local -c user.name=ci commit -m "diag run ${{ github.run_number }} [skip ci]" || echo "commit failed"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Ww-66888/dobby_lua_dump_build.git HEAD:refs/heads/ci-logs 2>&1 | tail -8 || echo "PUSH_FAIL"
          echo "publish step done"
