name: Build Dobby Lua Dump

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" --sdk_root=$ANDROID_HOME > /dev/null 2>&1
          echo "NDK at $ANDROID_HOME/ndk/27.0.12077973"

      - name: Clone Dobby (official) + patch for NDK
        run: |
          git clone --depth 1 --recursive https://github.com/jmpews/Dobby.git
          python3 scripts/patch_dobby.py
          echo "=== verify patched asm ==="
          grep -n "ldr TMP_REG_0, =common_closure_bridge_handler" Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm || echo "PATCH-NOT-APPLIED"

      - name: Build Dobby static lib
        run: |
          cmake -B dobby-build -S Dobby \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            > dobby_config.log 2>&1 || true
          echo "=== dobby config tail ==="
          tail -30 dobby_config.log
          cmake --build dobby-build --config Release --target dobby_static > dobby_build.log 2>&1 || true
          echo "=== dobby build tail ==="
          tail -50 dobby_build.log
          echo "=== dobby static artifacts ==="
          find dobby-build -name "libdobby*.a" -o -name "libdobby*.so" | head

      - name: Prepare Dobby lib
        run: |
          mkdir -p Dobby/lib
          A=$(find dobby-build -name "libdobby.a" | head -1)
          [ -z "$A" ] && A=$(find dobby-build -name "libdobby_static.a" | head -1)
          if [ -n "$A" ]; then cp "$A" Dobby/lib/libdobby.a && echo "copied $A"; else echo "NO dobby static lib produced"; fi
          ls -la Dobby/lib/ || true

      - name: Configure our lib
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/27.0.12077973/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            > our_config.log 2>&1 || true
          echo "=== our config tail ==="
          tail -30 our_config.log

      - name: Build our lib
        run: |
          cmake --build build --config Release > our_build.log 2>&1 || true
          echo "=== our build tail ==="
          tail -50 our_build.log
          echo "=== outputs ==="
          find build -name "libdump*.so" | head

      - name: Package (always)
        if: always()
        run: |
          mkdir -p output/lib/arm64-v8a output/log
          SO=$(find build -name "libdump.so" | head -1)
          if [ -n "$SO" ]; then
            cp "$SO" output/lib/arm64-v8a/
            echo "Copied: $SO"
          else
            echo "NO libdump.so produced" > output/log/error.txt
          fi
          for f in dobby_config.log dobby_build.log our_config.log our_build.log; do
            [ -f "$f" ] && cp "$f" output/log/ || true
          done
          echo "::error title=DOBBY_CONFIG::$(tail -20 dobby_config.log 2>/dev/null | tr '\n' ' ' | cut -c1-2000)"
          echo "::error title=DOBBY_BUILD::$(tail -90 dobby_build.log 2>/dev/null | tr '\n' ' ' | cut -c1-5000)"
          echo "::error title=OUR_BUILD::$(tail -40 our_build.log 2>/dev/null | tr '\n' ' ' | cut -c1-2000)"
          echo "::error title=OUTPUTS::$(find build -name 'libdump*' 2>/dev/null | tr '\n' ' ')"

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libdump-arm64
          path: output/
